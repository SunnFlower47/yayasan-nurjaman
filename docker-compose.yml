services:
  postgres:
    image: postgres:17-alpine
    container_name: yayasan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-yayasan_nurjaman}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-yayasan_nurjaman}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - yayasan_network

volumes:
  postgres_data:
    name: yayasan_nurjaman_postgres_data

networks:
  yayasan_network:
    name: yayasan_nurjaman_network

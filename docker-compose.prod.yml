# ==============================================================================
# Docker Compose untuk Lingkungan Produksi (Production)
# Yayasan Nurjaman Bongas Purwakarta
# ==============================================================================
# Keamanan Ketat & Prinsip Hak Minimal (Least Privilege):
# 1. HANYA layanan reverse-proxy (Caddy) yang mempublikasikan port 80/443.
# 2. Database dan app TIDAK mempublikasikan port ke host publik.
# 3. Kredensial database dipisah per role (db_migrator, db_app, db_backup).
# 4. Layanan backup-worker memasang uploads secara READ-ONLY (:ro).
# 5. Layanan restore-worker berjalan sebagai jalur terpisah (one-off).
# 6. Tidak ada kata sandi bernilai tetap di berkas compose ini.
# ==============================================================================

services:
  reverse-proxy:
    image: caddy:2.9.1-alpine
    container_name: yayasan_proxy_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - uploads_public:/var/data/uploads_public:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - yayasan_public
      - yayasan_internal
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      target: runner
    container_name: yayasan_app_prod
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1001,gid=1001
    user: "1001:1001"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://${DB_APP_USER:-db_app}:${DB_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-yayasan_db}?schema=public
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://localhost,http://localhost:3000}
      - AUTH_SECRET=${AUTH_SECRET}
      - ENCRYPTION_KEY_ACTIVE_ID=${ENCRYPTION_KEY_ACTIVE_ID}
      - ENCRYPTION_KEYS=${ENCRYPTION_KEYS}
      - BLIND_INDEX_SECRET=${BLIND_INDEX_SECRET}
    volumes:
      - uploads_private:/var/data/uploads_private
      - uploads_public:/var/data/uploads_public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - yayasan_internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:17.2-bookworm
    container_name: yayasan_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yayasan_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib disetel}
      DB_MIGRATOR_USER: ${DB_MIGRATOR_USER:-db_migrator}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD wajib disetel}
      DB_APP_USER: ${DB_APP_USER:-db_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD wajib disetel}
      DB_BACKUP_USER: ${DB_BACKUP_USER:-db_backup}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD:?DB_BACKUP_PASSWORD wajib disetel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - yayasan_internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-yayasan_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  migrate:
    build:
      context: .
      target: migrator
    container_name: yayasan_migrate_prod
    restart: "no"
    environment:
      - DATABASE_URL=postgresql://${DB_MIGRATOR_USER:-db_migrator}:${DB_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB:-yayasan_db}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - yayasan_internal
    security_opt:
      - no-new-privileges:true

  backup-worker:
    build:
      context: ./docker/backup
      dockerfile: Dockerfile
    container_name: yayasan_backup_prod
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${DB_BACKUP_USER:-db_backup}
      POSTGRES_PASSWORD: ${DB_BACKUP_PASSWORD:?DB_BACKUP_PASSWORD wajib disetel}
      POSTGRES_DB: ${POSTGRES_DB:-yayasan_db}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-${BACKUP_ENCRYPTION_KEY:?Kunci backup wajib disetel}}
      BACKUP_CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-0 2 * * *}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      RETENTION_KEEP: ${RETENTION_KEEP:-10}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-}
    volumes:
      - backups_data:/backups
      - uploads_private:/var/data/uploads_private:ro
      - uploads_public:/var/data/uploads_public:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - yayasan_internal
    security_opt:
      - no-new-privileges:true

  restore-worker:
    build:
      context: ./docker/backup
      dockerfile: Dockerfile
    container_name: yayasan_restore_prod
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${DB_MIGRATOR_USER:-db_migrator}
      POSTGRES_PASSWORD: ${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD wajib disetel}
      POSTGRES_DB: ${POSTGRES_DB:-yayasan_db}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-${BACKUP_ENCRYPTION_KEY:?Kunci backup wajib disetel}}
    volumes:
      - backups_data:/backups
      - uploads_private:/var/data/uploads_private
      - uploads_public:/var/data/uploads_public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - yayasan_internal
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    name: yayasan_prod_postgres_data
  uploads_private:
    name: yayasan_prod_uploads_private
  uploads_public:
    name: yayasan_prod_uploads_public
  backups_data:
    name: yayasan_prod_backups_data
  caddy_data:
    name: yayasan_prod_caddy_data
  caddy_config:
    name: yayasan_prod_caddy_config

networks:
  yayasan_public:
    name: yayasan_prod_public
  yayasan_internal:
    name: yayasan_prod_internal
